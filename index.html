<title>Society Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a society's office register — grouped index of registers on the left, ledger-style tables on the right; stacks to a top tab strip on phones. Light only. */
:root{
  --bg:#ECF0ED; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#16302B; --muted:#5A6C66; --line:#D3DDD8;
  --accent:#1E6B58; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6; --brass:#A97A24; --brass-soft:#F4EAD4;
  --good:#1F7A4D; --good-soft:#DDF1E5; --warn:#9A6400; --warn-soft:#FBEFD6; --bad:#B23A30; --bad-soft:#F8E1DE;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small.muted{display:block}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--sunk);padding:20px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.seal{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--brass);display:grid;place-items:center;font-family:var(--display);color:var(--brass);font-size:17px;flex:none}
.brand b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.2;display:block}
.brand small{color:var(--muted);font-size:12px}
.me{display:flex;gap:9px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px}
.me img{width:28px;height:28px;border-radius:50%;flex:none}
.me b{display:block;font-weight:600;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:1px}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brass);font-weight:600;padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;font-size:14px}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.badge{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--brass-soft);color:var(--brass)}
.badge.red{background:var(--bad-soft);color:var(--bad)}

.main{padding-block:26px 72px;padding-inline:clamp(16px,3.5vw,44px);min-width:0;max-width:1260px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.head>div:first-child{min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:4px}
.head h1{font-size:clamp(25px,3.4vw,33px)}
.head p{margin:4px 0 0;color:var(--muted);max-width:66ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:13px;font-weight:500}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.primary.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.export{font-family:var(--mono);font-size:12.5px;font-weight:500;padding:6px 10px}
.btn[disabled]{opacity:.55;cursor:default}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[type=month],input[type=tel],input[type=email],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.tools input,.tools select{width:auto}
textarea{resize:vertical;min-height:84px}

.banner{border:1px solid var(--line);background:var(--brass-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:14px}
.note{border-left:3px solid var(--brass);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--muted);margin-bottom:16px;max-width:80ch}
.demo{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--brass);color:#fff;border-radius:4px;padding:1px 6px;vertical-align:middle}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-weight:500;font-size:21px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12.5px;color:var(--muted)}
button.kpi{text-align:left;cursor:pointer;font:inherit}
button.kpi:hover{border-color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.sec+.sec,.tw+.sec,.sec+.tw,.tw+.tw{margin-top:18px}
.grid2 .sec+.sec,.split .sec+.sec{margin-top:0}
.sec h2{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 .btn{font-family:var(--body)}
h2.sub{font-size:20px;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list li:first-child{border-top:0}
.list .t{min-width:0}
.list .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.list .t small{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}

.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t .acts{white-space:nowrap;text-align:right}
.t tr.dim td{color:var(--muted)}
.t small{color:var(--muted)}
.flat{font-family:var(--mono);font-weight:500;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;white-space:nowrap;font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.sample{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);border:1px dashed var(--brass);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.att{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.att button{border:0;background:var(--surface);padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.att button+button{border-left:1px solid var(--line)}
.att button[aria-pressed="true"].P{background:var(--good-soft);color:var(--good)}
.att button[aria-pressed="true"].A{background:var(--bad-soft);color:var(--bad)}
.att button[aria-pressed="true"].L{background:var(--warn-soft);color:var(--warn)}

.notices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.notice.pinned{border-color:var(--brass)}
.notice h3{font-size:18px}
.notice p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.notice .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:auto;flex-wrap:wrap}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.party{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.party img{height:44px;max-width:150px;background:#fff;border-radius:4px}

.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:4px 0 2px}
.flow span{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:3px 10px}
.flow i{color:var(--brass);font-style:normal}

.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brass)}
.timeline small{color:var(--muted)}
.check{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:4px 14px;font-size:14px}

.steps{counter-reset:s;list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-family:var(--display);flex:none}
.steps li.done{color:var(--muted);text-decoration:line-through}

.setform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px}
.req{color:var(--bad)}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:500!important;font-size:14px}
.chk input{margin-top:4px}
.pad{width:100%;height:170px;border:1.5px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair;display:block}

.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);display:grid;place-items:center;padding:16px;z-index:20}
#secScrim{z-index:25}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal h2{font-size:22px;margin-bottom:14px}
.modal .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.mErr{margin-top:12px;color:var(--bad);font-size:14px}
.mFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:26px;letter-spacing:.25em;background:var(--sunk);border:1px dashed var(--brass);border-radius:8px;padding:8px 14px;display:inline-block}
.otp{font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center;max-width:220px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

.gate{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;padding:16px;overflow:auto}
.gatebox{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px}
.gatebox h1{font-size:26px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 16px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.inbox{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:13.5px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px 0;gap:8px;overflow:visible}
  .me{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;padding-bottom:8px}
  .grp{display:none}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .modal .fields{grid-template-columns:1fr}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="seal" id="seal">S</div><div><b id="brandName">Society Register</b><small id="brandSub">Housing society office</small></div></div>
    <div class="me" id="meBox" hidden></div>
    <nav class="nav" id="nav" aria-label="Registers"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <form id="mForm" novalidate>
      <h2 id="mTitle"></h2>
      <div id="mBody" class="fields"></div>
      <div class="mErr" id="mErr" hidden></div>
      <div class="mFoot" id="mFoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button type="submit" class="btn primary" id="mOk">Save</button></div>
    </form>
  </div>
</div>
<div class="scrim" id="secScrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="secTitle" style="width:min(440px,100%)">
    <h2 id="secTitle">Confirm it’s you</h2>
    <div id="secBody"></div>
    <div class="mErr" id="secErr" hidden></div>
    <div class="mFoot"><button type="button" class="btn" data-act="secCancel">Cancel</button><button type="button" class="btn primary" data-act="secVerify">Confirm</button></div>
  </div>
</div>
<div class="gate" id="gate" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* =========== helpers =========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const thisMonth=()=>today().slice(0,7);
const monthLabel=m=>{if(!m)return'';const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
const fmtDate=d=>{if(!d)return'—';const[y,m,dd]=String(d).slice(0,10).split('-');return new Date(+y,+m-1,+(dd||1)).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const fmtStamp=iso=>{if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':');const d=new Date();d.setHours(+h,+m);return d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',hour12:true})};
const addMonths=(d,n)=>{const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1+n,dd).toLocaleDateString('en-CA')};
const daysUntil=d=>{if(!d)return null;const[y,m,dd]=d.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,dd)-t)/864e5)};
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
const curCode=()=>S.settings.currency||'INR';
function money(n){try{return new Intl.NumberFormat(curCode()==='INR'?'en-IN':'en-GB',{style:'currency',currency:curCode(),maximumFractionDigits:0}).format(+n||0)}catch(e){return(+n||0).toLocaleString()}}
const moneyPlain=n=>(curCode()==='INR'?'Rs. ':curCode()+' ')+Math.round(+n||0).toLocaleString(curCode()==='INR'?'en-IN':'en-GB');
const flatLabel=f=>f?((f.wing?f.wing+'-':'')+(f.number||'?')):'—';
const flatById=id=>S.flats.find(f=>f.id===id);
const sortFlats=a=>[...a].sort((x,y)=>flatLabel(x).localeCompare(flatLabel(y),undefined,{numeric:true}));
const byDateDesc=(a,k='date')=>[...a].sort((x,y)=>String(y[k]||'').localeCompare(String(x[k]||'')));
const byDateAsc=(a,k='date')=>[...a].sort((x,y)=>String(x[k]||'').localeCompare(String(y[k]||'')));
const sampleTag=x=>x&&x.sample?'<span class="sample">Sample</span>':'';
const C=h=>ME.committee?h:'';
const by=(col,id)=>(S[col]||[]).find(x=>x.id===id);
const strip=o=>{const c={...o};delete c.id;return c};
const fail=m=>{const e=new Error(m);e.userMsg=m;return e};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const vendorName=id=>{const v=by('vendors',id);return v?v.name:''};

/* =========== state =========== */
const COLS=['flats','dues','bills','payments','fds','staff','attendance','vendors','amc','amcVisits','documents','esign','signatures','notices','complaints','reminders','handovers','tenantdocs','kyc'];
const S={settings:{},settingsLoaded:false,audit:[],myFiles:[]};COLS.forEach(c=>S[c]=[]);
const FILES={};
const UI={horizon:90,tab:lsGet('sr_tab')||'dashboard',month:thisMonth(),q:'',payStatus:'Awaiting',docCat:'All',cmpStatus:'Open',attDate:today(),fdStatus:'Active',remFilter:'All'};
let db=null,assets=null,DL=null,USER=null,mode='loading';
const ME={id:null,name:'',avatar:'',committee:false,owner:false};
const NAMES={};let REPORT=null;

const DOC_CATS=['Registration & bye-laws','Meeting minutes','Audit & accounts','Insurance','Contracts & AMC','Property papers','NOCs & letters','Other'];

const addDays=(d,n)=>{const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd+n).toLocaleDateString('en-CA')};

function billAmount(b){const st=S.staff.filter(s=>s.active!==false),src=b.amountSource||'Fixed amount';
  if(src==='Security staff pay')return sum(st.filter(s=>s.role==='Security'),'salary');if(src==='Sweeper staff pay')return sum(st.filter(s=>s.role==='Sweeper'),'salary');if(src==='All staff pay')return sum(st,'salary');return +b.amount||0}
const emiLeft=b=>b.category==='Loan / EMI'&&+b.totalInstalments?Math.max(0,+b.totalInstalments-(+b.paidInstalments||0)):Infinity;
function occurrences(b,until){if(b.done||!b.nextDue)return[];const step=FREQ[b.frequency]??1,left=emiLeft(b),out=[];let d=b.nextDue;
  while(d<=until&&out.length<left&&out.length<60){out.push(d);if(!step)break;d=addMonths(d,step)}return out}
function upcoming(days){
  const until=addDays(today(),days),R=[];
  S.bills.forEach(b=>occurrences(b,until).forEach((d,i)=>R.push({date:d,kind:b.category==='Loan / EMI'?'EMI':'Bill',title:b.name,sub:[b.payee||vendorName(b.vendorId),b.autopay?'Auto-debit':''].filter(Boolean).join(' · '),amount:billAmount(b),dir:'out',bill:b.id,first:i===0})));
  S.payments.filter(p=>p.status==='Approved').forEach(p=>R.push({date:p.date||today(),kind:'Approved payment',title:p.payee||vendorName(p.vendorId),sub:p.purpose||'',amount:+p.amount||0,dir:'out',tab:'payments'}));
  S.fds.filter(f=>f.status==='Active'&&f.maturity&&f.maturity<=until).forEach(f=>R.push({date:f.maturity,kind:'FD maturity',title:`${f.bank} FD${f.fdRef?' •••'+f.fdRef:''}`,sub:f.autoRenew?'Set to auto-renew':'Decide: renew or close',amount:+f.maturityAmount||+f.principal||0,dir:'in',tab:'fds'}));
  const dueDay=+S.settings.dueDay||10;
  for(let k=0;k<=Math.ceil(days/28);k++){const m=addMonths(thisMonth()+'-01',k).slice(0,7),d=`${m}-${String(dueDay).padStart(2,'0')}`;if(d<today()||d>until)continue;
    const md=S.dues.filter(x=>x.month===m),exp=md.length?sum(md.filter(x=>!x.paid),'amount'):S.flats.reduce((t,f)=>t+(+(f.monthlyCharge||S.settings.monthlyCharge)||0),0);
    if(exp)R.push({date:d,kind:'Maintenance',title:`${monthLabel(m)} maintenance from residents`,sub:md.length?`${md.filter(x=>!x.paid).length} flats yet to pay`:'Bills not created yet',amount:exp,dir:'in',tab:'maint'})}
  return R.sort((a,b)=>a.date.localeCompare(b.date));
}

const TYPES={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',csv:'text/csv',txt:'text/plain',md:'text/markdown',json:'application/json'};
const ASSET_MSG={too_large:'That file is over 20 MB. Compress it or save a link instead.',unsupported_type:'Upload a PDF or an image. For Word or Excel files, save as PDF or paste a link.',quota_or_state:'File storage is full. Delete an old file and try again.',rate_limited:'Too many uploads at once. Wait a moment and try again.'};
async function uploadAsset(file){
  if(!assets)throw fail('File uploads aren’t available for you here. Paste a link instead.');
  const ext=(file.name.split('.').pop()||'').toLowerCase();const type=Object.values(TYPES).includes(file.type)?file.type:TYPES[ext];
  if(!type)throw fail(ASSET_MSG.unsupported_type);
  try{return(await assets.upload(file,{type})).id}catch(e){throw fail(ASSET_MSG[e&&e.code]||'The upload didn’t go through. Try again.')}
}
async function withFile(v,old){const file=v.file;delete v.file;const r={...v};if(file){r.assetId=await uploadAsset(file);r.fileName=file.name}else if(old&&old.assetId){r.assetId=old.assetId;r.fileName=old.fileName}return r}
const fileHref=x=>x&&x.assetId?'/_blob/'+x.assetId:(x&&x.link)||'';
const fileBtn=(x,label='Open')=>{const h=fileHref(x);return h?`<a class="btn small" href="${esc(h)}" target="_blank" rel="noopener">${label}</a>`:''};
async function smallDataUrl(file){
  if(file.type.startsWith('image/')){
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(fail('That image couldn’t be read.'));i.src=URL.createObjectURL(file)});
    let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,1600/Math.max(w,h)),q=.78,out='';
    for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<230000)break;scale*=.78;q=Math.max(.5,q-.06)}
    if(out.length>=230000)throw fail('That photo is too large even after shrinking. Try a smaller photo.');return out;
  }
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
    if(file.size>170000)throw fail('PDFs must be under 170 KB here. Take a photo of the page instead, or give the paper to the committee.');
    return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(fail('That file couldn’t be read.'));r.readAsDataURL(file)});
  }
  throw fail('Upload a photo (JPG/PNG) or a small PDF.');
}
function dataUrlToBlob(u){const[h,b]=u.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}

function computeReminders(){
  const R=[],t=today(),push=(date,kind,text,tab,days)=>R.push({date,kind,text,tab,days:days??daysUntil(date)});
  S.amcVisits.filter(v=>v.status==='Scheduled').forEach(v=>{const c=by('amc',v.contractId);const d=daysUntil(v.date);if(d<=7)push(v.date,'AMC visit',`${c?c.equipment:'AMC'} service visit${c&&vendorName(c.vendorId)?' by '+vendorName(c.vendorId):''}${v.time?' at '+fmtTime(v.time):''}${d<0?' was due and isn’t marked done':''}`,'amc')});
  S.amc.forEach(c=>{const d=daysUntil(c.end);if(d!==null&&d<=60)push(c.end,'AMC renewal',`${c.equipment} AMC with ${vendorName(c.vendorId)||'vendor'} ${d<0?'expired':'expires'} — ${d<0?'renew now':d<=7?'renew this week':'get renewal quote'}`,'amc')});
  S.bills.forEach(b=>{if(b.done||!b.nextDue||emiLeft(b)<=0)return;const d=daysUntil(b.nextDue);if(d<=(+b.leadDays||7))push(b.nextDue,b.category==='Loan / EMI'?'EMI due':'Bill due',`${b.name} — ${money(billAmount(b))}${b.payee||vendorName(b.vendorId)?' to '+(b.payee||vendorName(b.vendorId)):''}${b.autopay?' (auto-debit, keep balance ready)':''}${d<0?' is overdue':''}`,'bills')});
  S.fds.filter(f=>f.status==='Active').forEach(f=>{const d=daysUntil(f.maturity);if(d!==null&&d<=30)push(f.maturity,'FD maturity',`FD ${f.fdRef?'•••'+f.fdRef+' ':''}at ${f.bank} (${money(f.principal)} → ${money(f.maturityAmount)}) ${d<0?'has matured — renew or close it':f.autoRenew?'matures and is set to auto-renew; confirm the new rate':'matures — decide whether to renew or close'}`,'fds')});
  S.documents.filter(x=>x.expiry).forEach(x=>{const d=daysUntil(x.expiry);if(d<=30)push(x.expiry,'Document expiry',`${x.title} ${d<0?'has expired':'expires'}`,'documents')});
  const dueDay=+S.settings.dueDay||10,dd=`${thisMonth()}-${String(dueDay).padStart(2,'0')}`;
  const unpaid=S.dues.filter(x=>x.month===thisMonth()&&!x.paid);
  if(unpaid.length&&t>dd)push(dd,'Maintenance',`${unpaid.length} flat${unpaid.length>1?'s have':' has'} not paid ${monthLabel(thisMonth())} maintenance (${money(sum(unpaid,'amount'))})`,'maint');
  S.payments.filter(p=>p.status==='Pending approval').forEach(p=>push(p.date||t,'Approval',`Payment of ${money(p.amount)} to ${p.payee||vendorName(p.vendorId)} needs ${2-(p.approvals||[]).length} more signatory approval`,'payments',0));
  S.esign.forEach(r=>{const left=(r.parties||[]).filter(p=>!sigFor(r.id,p.role));if(left.length)push(r.date||t,'E-signature',`${r.title} awaits signature from ${left.map(p=>p.role.toLowerCase()).join(' and ')}`,'esign',0)});
  S.reminders.filter(r=>!r.done).forEach(r=>{const d=daysUntil(r.date);if(d<=(+r.leadDays||7))push(r.date,'Reminder',r.title,'reminders')});
  return R.sort((a,b)=>a.date.localeCompare(b.date));
}

/* =========== UPCOMING PAYMENTS =========== */
function vBills(){
  const H=+UI.horizon||90,items=upcoming(H),out=items.filter(x=>x.dir==='out');
  const grp=x=>{const d=daysUntil(x.date);return d<0?'Overdue':d<=6?'Next 7 days':d<=13?'In 1–2 weeks':d<=30?'Later this month':'31–'+H+' days'};
  const order=['Overdue','Next 7 days','In 1–2 weeks','Later this month','31–'+H+' days'];
  const groups=order.map(g=>[g,items.filter(x=>grp(x)===g)]).filter(([,l])=>l.length);
  const loans=S.bills.filter(b=>b.category==='Loan / EMI'&&!b.done);
  const bills=byDateAsc(S.bills.filter(b=>!b.done),'nextDue').concat(S.bills.filter(b=>b.done));
  REPORT={title:`Upcoming payments — next ${H} days`,cols:['Due','Type','Item','Payee / note','Amount','Direction','Status'],rows:items.map(x=>[fmtDate(x.date),x.kind,x.title,x.sub||'',moneyPlain(x.amount),x.dir==='in'?'Incoming':'Outgoing',remLevel(daysUntil(x.date))[1]])};
  const tools=`<select id="horizon" data-chg="horizon" aria-label="Look ahead" style="width:auto">${[30,60,90,180,365].map(n=>`<option value="${n}" ${n===H?'selected':''}>Next ${n} days</option>`).join('')}</select>`+addBtn('bills','Add recurring bill');
  const h=head('Payment calendar','Upcoming payments','Every bill, salary and EMI the society has to pay, with FD maturities and maintenance coming in. Bills due within their reminder window also appear in Reminders and the weekly summary.',tools);
  const kp=`<div class="kpis">
    <div class="kpi"><span>Overdue</span><b style="color:${out.some(x=>daysUntil(x.date)<0)?'var(--bad)':'inherit'}">${money(sum(out.filter(x=>daysUntil(x.date)<0),'amount'))}</b><small>${out.filter(x=>daysUntil(x.date)<0).length} items</small></div>
    <div class="kpi"><span>To pay · next 7 days</span><b>${money(sum(out.filter(x=>{const d=daysUntil(x.date);return d>=0&&d<=7}),'amount'))}</b><small>${out.filter(x=>{const d=daysUntil(x.date);return d>=0&&d<=7}).length} items</small></div>
    <div class="kpi"><span>To pay · next ${H} days</span><b>${money(sum(out,'amount'))}</b><small>Fund today ${money(fundBalance())}</small></div>
    <div class="kpi"><span>FDs maturing · ${H} days</span><b>${money(sum(items.filter(x=>x.kind==='FD maturity'),'amount'))}</b><small>${items.filter(x=>x.kind==='FD maturity').length} deposits</small></div>
    ${loans.length?`<div class="kpi"><span>Loan EMIs left</span><b>${loans.reduce((t,b)=>t+(emiLeft(b)===Infinity?0:emiLeft(b)),0)}</b><small>${money(loans.reduce((t,b)=>t+(emiLeft(b)===Infinity?0:emiLeft(b)*billAmount(b)),0))} still to pay</small></div>`:''}</div>`;
  const tl=groups.length?groups.map(([g,l])=>`<h2 class="sub" style="margin-top:18px">${g} <span class="num" style="font-family:var(--mono);font-size:14px;color:var(--muted)">${money(sum(l.filter(x=>x.dir==='out'),'amount'))} to pay${l.some(x=>x.dir==='in')?' · '+money(sum(l.filter(x=>x.dir==='in'),'amount'))+' coming in':''}</span></h2>
    <div class="tw"><table class="t"><tbody>${l.map(x=>{const b=x.bill&&by('bills',x.bill);return`<tr><td style="white-space:nowrap;width:120px">${fmtDate(x.date)}</td><td><b>${esc(x.title)}</b>${b?sampleTag(b):''}<br><small>${esc(x.kind)}${x.sub?' · '+esc(x.sub):''}</small></td><td class="r num" style="color:${x.dir==='in'?'var(--good)':'inherit'};white-space:nowrap">${x.dir==='in'?'+ ':''}${money(x.amount)}</td><td style="width:110px">${remPill(x.date)}</td>
    <td class="acts">${b&&x.first?C(b.autopay?`<button class="btn small primary" data-act="billAuto" data-id="${b.id}">Record auto-debit</button>`:`<button class="btn small primary" data-act="billPay" data-id="${b.id}">Raise payment</button>`)+C(` <button class="btn small" data-act="billSkip" data-id="${b.id}">Paid elsewhere</button>`):x.tab?`<button class="btn small" data-act="tab" data-k="${x.tab}">Open</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`).join(''):emptyCard('Nothing due',`No bills, EMIs or FD maturities in the next ${H} days.`);
  const tbl=`<h2 class="sub">Recurring bills & EMIs</h2>${bills.length?`<div class="tw"><table class="t"><thead><tr><th>Bill</th><th>Paid to</th><th class="r">Amount</th><th>Repeats</th><th>Next due</th><th>Remind</th><th></th></tr></thead><tbody>${bills.map(b=>{const left=emiLeft(b);return`<tr class="${b.done||left<=0?'dim':''}"><td><b>${esc(b.name)}</b>${sampleTag(b)}<br><small>${esc(b.category)}${b.autopay?' · Auto-debit':''}${b.category==='Loan / EMI'&&+b.totalInstalments?` · ${+b.paidInstalments||0} of ${b.totalInstalments} EMIs paid`:''}${b.amountSource&&b.amountSource!=='Fixed amount'?' · '+esc(b.amountSource):''}</small></td>
    <td>${esc(b.payee||vendorName(b.vendorId)||'—')}${b.lender?`<br><small>${esc(b.lender)}</small>`:''}</td><td class="r num">${money(billAmount(b))}</td><td>${esc(b.frequency)}</td><td style="white-space:nowrap">${b.done||left<=0?'<span class="pill neutral">Finished</span>':fmtDate(b.nextDue)+'<br>'+remPill(b.nextDue)}</td><td>${+b.leadDays||7} days before</td><td class="acts">${editDel('bills',b.id)}</td></tr>`}).join('')}</tbody></table></div>`:emptyCard('No recurring bills yet','Add electricity, water, guard and sweeper salaries, AMC instalments, insurance premium, property tax and any loan EMI. Each one gets a due date and repeats automatically.')}`;
  return h+kp+tl+tbl;
}

/* =========== MAINTENANCE =========== */
function vMaint(){
  const m=UI.month,flats=sortFlats(S.flats),md=S.dues.filter(d=>d.month===m),byF=Object.fromEntries(md.map(d=>[d.flatId,d]));
  const missing=flats.filter(f=>!byF[f.id]),billed=sum(md,'amount'),coll=sum(md.filter(d=>d.paid),'amount'),pct=billed?Math.round(coll/billed*100):0;

function readFields(form,fields){
  const o={};for(const f of fields){const el=form.elements[f.k];if(!el)continue;
    if(f.type==='checkbox')o[f.k]=el.checked;else if(f.type==='file'||f.type==='smallfile')o[f.k]=el.files[0]||null;

/* =========== passkey / OTP check =========== */
let SEC=null;
const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function secureCheck(label){
  if(window.PublicKeyCredential&&navigator.credentials&&lsGet('sr_pk_off')!=='1'){
    try{
      const challenge=crypto.getRandomValues(new Uint8Array(32)),stored=lsGet('sr_pk');
      if(stored){await navigator.credentials.get({publicKey:{challenge,allowCredentials:[{type:'public-key',id:b64d(stored)}],userVerification:'required',timeout:60000}});toast('Confirmed with passkey');return}
      const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:'Society Register'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:ME.name||'committee',displayName:ME.name||'Committee member'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{userVerification:'required'},timeout:60000}});
      lsSet('sr_pk',b64e(cred.rawId));toast('Passkey set up and confirmed');return;
    }catch(e){if(e&&(e.name==='SecurityError'||e.name==='NotSupportedError'))lsSet('sr_pk_off','1')}
  }
  return otpCheck(label);
}
function otpCheck(label){
  return new Promise((res,rej)=>{
    const code=String(Math.floor(100000+Math.random()*900000));SEC={code,res,rej};
    $('#secTitle').textContent='Confirm it’s you';$('#secErr').hidden=true;
    $('#secBody').innerHTML=`<p style="margin:0 0 10px">${esc(label)} is a protected action. A passkey isn’t available in this browser view, so confirm with a one-time code.</p>
      <div class="inbox"><span class="demo">Demo</span> In a live system this code would arrive by SMS. Nothing is actually sent.<br><span class="code" style="margin-top:8px">${code}</span></div>
      <div class="field" style="margin-top:12px"><label for="secCode">Enter the 6-digit code</label><input id="secCode" class="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>`;
    $('#secScrim').hidden=false;$('#secCode').focus();
  });
}

const NOUN={bills:'recurring bill',flats:'flat',complaints:'complaint',notices:'notice',reminders:'reminder',fds:'fixed deposit',staff:'staff member',vendors:'vendor',amc:'AMC contract',documents:'document',kyc:'tenant document',esign:'signing request',payments:'payment'};
const SENSITIVE_DEL=new Set(['flats','payments','fds','esign','kyc','documents','amc','vendors']);
function prep(col,v,old){
  if(col==='fds'&&v.fdRef)v.fdRef=String(v.fdRef).replace(/\D/g,'').slice(-4);
  if(col==='fds'&&v.maturityAmount===''&&v.principal&&v.payout&&!/^Cumulative/.test(v.payout))v.maturityAmount=v.principal;
  if(col==='fds'&&v.maturityAmount===''&&v.principal&&v.rate&&v.start&&v.maturity){const yrs=Math.max(0,(new Date(v.maturity)-new Date(v.start))/31557600000);v.maturityAmount=Math.round(v.principal*Math.pow(1+v.rate/400,4*yrs))}
  if(col==='complaints'&&!old)v.status='Open';
  return v;
}
const CRUD={
  async add(col){openForm({title:`Add ${NOUN[col]}`,fields:F[col](),ok:'Save',submit:async v=>{const rec=prep(col,await withFile(v),null);const id=await store.add(col,rec);if(col==='amc')await autoSchedule(id,rec);await log(`Added ${NOUN[col]}`,LABEL[col](rec));return`${NOUN[col][0].toUpperCase()+NOUN[col].slice(1)} added`}})},
  async edit(col,id){const x=by(col,id);openForm({title:`Edit ${NOUN[col]}`,fields:F[col](),values:x,submit:async v=>{const rec=prep(col,await withFile(v,x),x);await store.set(col,id,{...strip(x),...rec});await log(`Edited ${NOUN[col]}`,LABEL[col]({...x,...rec}));return'Saved'}})},
  async del(col,id){const x=by(col,id);confirmBox(`Delete this ${NOUN[col]}?`,`${esc(LABEL[col](x))} will be removed for everyone.${col==='flats'?' Its maintenance bills will be removed too.':''} This can’t be undone.`,'Delete',async()=>{
    if(SENSITIVE_DEL.has(col))await secureCheck(`Deleting a ${NOUN[col]}`);
    if(col==='flats')for(const d of S.dues.filter(d=>d.flatId===id))await store.del('dues',d.id);
    if(col==='amc')for(const v of S.amcVisits.filter(v=>v.contractId===id))await store.del('amcVisits',v.id);
    if(col==='esign')for(const s of S.signatures.filter(s=>s.requestId===id))await store.del('signatures',s.id);
    await store.del(col,id);if(x.assetId&&assets){try{await assets.delete(x.assetId)}catch(e){}}
    await log(`Deleted ${NOUN[col]}`,LABEL[col](x));return'Deleted'})}
};
async function autoSchedule(contractId,c){
  const n=+c.visitsPerYear;if(!n||!c.start)return;const step=Math.max(1,Math.round(12/n));let d=c.start;
  while(d<today())d=addMonths(d,step);
  if(c.end&&d>c.end)return;
  await store.add('amcVisits',{contractId,date:d,time:'10:00',status:'Scheduled',auto:true});
}

  hoNew:()=>openForm({title:'Start committee handover',ok:'Create draft',fields:hoF(),values:{title:`Committee handover ${new Date().getFullYear()}`},submit:async v=>{const rec={...v,status:'Draft',checklist:{},approvals:[],log:[{at:new Date().toISOString(),uid:ME.id,action:'Draft created'}]};await store.add('handovers',rec);await log('Started committee handover',v.title);return'Handover draft created'}}),
  hoEdit:d=>{const h=by('handovers',d.id);openForm({title:'Edit handover',fields:hoF(),values:h,submit:async v=>{await store.set('handovers',h.id,{...strip(h),...v,log:[...(h.log||[]),{at:new Date().toISOString(),uid:ME.id,action:'Details edited'}]});await log('Edited handover',h.title);return'Saved'}})},
  hoSubmit:d=>{const h=by('handovers',d.id),done=CHECKLIST.filter(([k])=>(h.checklist||{})[k]).length;confirmBox('Submit for approval?',`The handover details and checklist (${done}/${CHECKLIST.length} done) will be locked and the current fund, FD and dues figures recorded. Then the outgoing and incoming representatives each approve.`,'Submit',async()=>{const fds=activeFDs();await store.set('handovers',h.id,{...strip(h),status:'Pending approval',snapshot:{fund:fundBalance(),fdCount:fds.length,fdTotal:sum(fds,'principal'),dues:sum(S.dues.filter(x=>!x.paid),'amount')},log:[...(h.log||[]),{at:new Date().toISOString(),uid:ME.id,action:`Submitted for approval (${done}/${CHECKLIST.length} checklist items)`}]});await log('Submitted handover for approval',h.title);return'Submitted for approval'})},
  hoApprove:async d=>{const h=by('handovers',d.id),ap=h.approvals||[];
    if(ap.some(a=>a.uid===ME.id)){toast('You’ve already approved this handover. The other side must be approved by a different person.');return}
    try{await secureCheck(`Approving the handover as ${d.side.toLowerCase()} committee`)}catch(e){return}
    const n=[...ap,{uid:ME.id,side:d.side,at:new Date().toISOString()}],full=n.length>=2;
    try{await store.set('handovers',h.id,{...strip(h),approvals:n,status:full?'Approved':'Pending approval',log:[...(h.log||[]),{at:new Date().toISOString(),uid:ME.id,action:`Approved as ${d.side.toLowerCase()} committee`},...(full?[{at:new Date().toISOString(),uid:ME.id,action:'Handover complete and locked'}]:[])]});await log(`Approved handover (${d.side})`,h.title);toast(full?'Handover approved and locked':'Approved. Waiting for the other side.')}catch(e){toast(writeErr(e))}},
  /* gate */
  gateMethod:d=>{GATE.method=d.v;GATE.code=null;GATE.err='';GATE.rendered='';renderGate()},
  gateSend:()=>{const v=($('#gDest')||{}).value||'';const ok=GATE.method==='email'?/^\S+@\S+\.\S+$/.test(v):v.replace(/\D/g,'').length>=10;
    if(!ok){GATE.err=GATE.method==='email'?'Enter a valid email address.':'Enter a 10-digit mobile number.';GATE.rendered='';renderGate();return}
    GATE.dest=v;GATE.code=String(Math.floor(100000+Math.random()*900000));GATE.err='';GATE.rendered='';renderGate()},
  gateResend:()=>{GATE.code=String(Math.floor(100000+Math.random()*900000));GATE.err='';GATE.rendered='';renderGate()},
  gateVerify:()=>{const v=($('#gCode')||{}).value||'';if(v.trim()===GATE.code){ssSet('sr_ok','1');$('#gate').hidden=true;toast('Verified');render()}else{GATE.err='That code doesn’t match. Check it and try again.';GATE.rendered='';renderGate()}},
  secVerify:()=>{if(!SEC)return;const v=($('#secCode')||{}).value||'';if(v.trim()===SEC.code){const r=SEC.res;SEC=null;$('#secScrim').hidden=true;r()}else{$('#secErr').textContent='That code doesn’t match.';$('#secErr').hidden=false}},
  secCancel:()=>{if(!SEC)return;const r=SEC.rej;SEC=null;$('#secScrim').hidden=true;const e=new Error('cancelled');e.cancelled=true;r(e)},
  clearSample:()=>confirmBox('Remove sample records?','Every record tagged Sample will be deleted. Your own entries stay.','Remove samples',async()=>{for(const c of COLS)for(const x of (S[c]||[]).filter(x=>x.sample))await store.del(c,x.id);
    for(const a of S.attendance.filter(a=>a.sample))await store.del('attendance',a.id);
    if(S.settings.sample){const c=strip(S.settings);delete c.sample;['name','address','secretary'].forEach(k=>delete c[k]);await store.set('settings','main',c)}
    await log('Removed sample records');return'Sample records removed'})
};
let VIEWING=null;
async function advanceBill(b,note){const step=FREQ[b.frequency]??1,rec={...strip(b),lastPaid:b.nextDue,paidInstalments:(+b.paidInstalments||0)+1};
  if(!step)rec.done=true;else rec.nextDue=addMonths(b.nextDue,step);
  if(b.category==='Loan / EMI'&&+b.totalInstalments&&rec.paidInstalments>=+b.totalInstalments)rec.done=true;
  await store.set('bills',b.id,rec);await log('Bill settled',`${b.name} due ${fmtDate(b.nextDue)} — ${note}`)}
function duesMsg(f){const st=S.settings,un=S.dues.filter(x=>x.flatId===f.id&&!x.paid).sort((a,b)=>a.month.localeCompare(b.month)),dd=+st.dueDay||10;
  return `Dear ${f.owner},\n\nThis is a gentle reminder from ${st.name||'the society'} that maintenance of ${money(sum(un,'amount'))} for flat ${flatLabel(f)} is pending (${un.map(x=>monthLabel(x.month)).join(', ')}). Maintenance is due by the ${ordinal(dd)} of each month.${st.payInfo?`\n\nHow to pay: ${st.payInfo}`:''}\n\nPlease ignore this message if you have already paid.\n\n${st.secretary?st.secretary+', Secretary':'Managing Committee'}\n${st.name||''}`.trim()}
function openMsg(title,text,sub){openForm({title,ok:'Done',submit:async()=>{},custom:`<div class="field wide">${sub?`<small>${esc(sub)}</small>`:''}<textarea id="msgText" readonly style="min-height:240px;font-size:14px">${esc(text)}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-act="copyMsg">Copy message</button></div><small>Paste into WhatsApp, SMS or email. The register doesn’t send messages itself.</small></div>`})}
const visitF=()=>[{k:'date',label:'Visit date',type:'date',req:1,def:today()},{k:'time',label:'Time',type:'time',def:'10:00'},{k:'status',label:'Status',type:'select',options:['Scheduled','Completed','Missed']},{k:'engineer',label:'Engineer name'},{k:'engineerPhone',label:'Engineer phone',type:'tel'},{k:'work',label:'Work done / findings',type:'textarea',wide:1},...fileF('Service report')];
const hoF=()=>[{k:'title',label:'Title',req:1,wide:1},{k:'date',label:'Handover date',type:'date',req:1,def:today()},{k:'outgoing',label:'Outgoing committee',wide:1,hint:'Names and posts, e.g. R. Shah (Chairman), M. Iyer (Treasurer)'},{k:'incoming',label:'Incoming committee',wide:1},{k:'cash',label:'Cash in hand handed over',type:'number'},{k:'bank',label:'Bank balance on the day',type:'number'},{k:'notes',label:'Notes',type:'textarea',wide:1}];

/* =========== signature pad =========== */
const PAD={drawn:false};
function openSign(rid,role){
  const r=by('esign',rid),p=(r.parties||[]).find(x=>x.role===role);
  openForm({title:`Sign as ${role.toLowerCase()}`,ok:'Sign document',custom:`<div class="field wide"><small>Document: <b>${esc(r.title)}</b> · flat ${esc(flatLabel(flatById(r.flatId)))}</small>${fileHref(r)?`<div style="margin-top:6px">${fileBtn(r,'Read the document first')}</div>`:''}</div>
    <div class="field wide"><label for="sgPad">Draw your signature</label><canvas id="sgPad" class="pad" aria-label="Signature pad"></canvas><div><button type="button" class="btn small" data-act="padClear">Clear</button></div></div>
    <div class="field wide"><label for="sgName">Full name</label><input id="sgName" type="text" value="${esc(p?p.name:'')}"></div>
    <label class="chk" style="grid-column:1/-1"><input type="checkbox" id="sgAgree"> I, the ${esc(role.toLowerCase())}, have read “${esc(r.title)}” and agree to sign it electronically.</label>
    ${ME.committee?'<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="sgPerson"> Signed in person on a committee member’s device</label>':''}`,
    submit:async()=>{const name=$('#sgName').value.trim();if(!PAD.drawn)throw fail('Draw your signature in the box.');if(!name)throw fail('Type your full name.');if(!$('#sgAgree').checked)throw fail('Tick the box to confirm you agree.');
      const c=$('#sgPad'),img=trimPad(c);
      await store.set('signatures',`${rid}_${role}`,{requestId:rid,role,name,image:img,uid:ME.id,at:new Date().toISOString(),inPerson:!!($('#sgPerson')&&$('#sgPerson').checked),ua:navigator.userAgent.slice(0,120)});
      if(ME.committee)await log('Signature captured',`${role} on ${r.title}`);return'Signed'}});
  initPad($('#sgPad'));
}
function initPad(c){
  PAD.drawn=false;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#16302B';let down=false,last=null;
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!down)return;const p=pt(e);g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p;PAD.drawn=true};
  c.onpointerup=c.onpointercancel=()=>{down=false};
}
function trimPad(c){const o=document.createElement('canvas');const w=600,h=Math.round(600*c.height/c.width);o.width=w;o.height=h;const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(c,0,0,w,h);return o.toDataURL('image/png')}

/* =========== reports =========== */
async function saveFile(name,blob){
  if(!DL){toast('Downloads aren’t available in this view');return}
  try{await DL.save({filename:name,data:blob});toast('Download ready')}catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'A download is already waiting for you to confirm':'Couldn’t prepare the download')}
}
const fileStamp=()=>today();
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function exportReport(kind){
  if(!REPORT)return;const{title,cols,rows}=REPORT;const name=`${slug(S.settings.name||'society')}-${slug(title)}-${fileStamp()}`;
  if(kind==='csv'){const q=v=>{const s=String(v??'');return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};saveFile(name+'.csv',new Blob(['﻿'+[cols,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));return}
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('The PDF tool didn’t load. Use CSV, or reload the page.');return}
  const doc=new window.jspdf.jsPDF({orientation:cols.length>6?'landscape':'portrait',unit:'pt',format:'a4'});
  pdfHeader(doc,title);
  doc.autoTable({head:[cols],body:rows.map(r=>r.map(c=>String(c??''))),startY:92,styles:{fontSize:8.5,cellPadding:4,textColor:[22,48,43]},headStyles:{fillColor:[30,107,88],textColor:255},alternateRowStyles:{fillColor:[245,248,246]},margin:{left:36,right:36}});
  pdfFooter(doc);saveFile(name+'.pdf',doc.output('blob'));
}
function pdfHeader(doc,title){const st=S.settings;doc.setFont('times','normal');doc.setFontSize(17);doc.setTextColor(22,48,43);doc.text(st.name||'Society Register',36,44);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90,108,102);doc.text([st.address||'',st.regNo?'Reg. '+st.regNo:''].filter(Boolean).join('  ·  '),36,58);doc.setFontSize(12);doc.setTextColor(169,122,36);doc.text(title,36,78)}
function pdfFooter(doc){const n=doc.getNumberOfPages(),w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text(`Generated ${fmtStamp(new Date().toISOString())} · Page ${i} of ${n}`,36,h-20);doc.text('Society Register',w-36,h-20,{align:'right'})}}
function certificate(rid){
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('The PDF tool didn’t load. Reload the page and try again.');return}
  const r=by('esign',rid),doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});pdfHeader(doc,'Electronic signature record');
  let y=104;doc.setFontSize(10.5);doc.setTextColor(22,48,43);
  [['Document',r.title],['Flat',flatLabel(flatById(r.flatId))],['Request date',fmtDate(r.date)],['Document file',r.fileName||r.link||'—']].forEach(([k,v])=>{doc.setFont('helvetica','bold');doc.text(k,36,y);doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(String(v),380),150,y);y+=18});
  y+=10;(r.parties||[]).forEach(p=>{const s=sigFor(rid,p.role);doc.setDrawColor(211,221,216);doc.roundedRect(36,y,523,130,6,6);doc.setFont('helvetica','bold');doc.text(`${p.role}: ${s?s.name:p.name}`,50,y+22);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90,108,102);
    if(s){doc.text([`Signed: ${fmtStamp(s.at)}`,`Signed-in account: ${who(s.uid)}${s.inPerson?' (in person)':''}`,`Device: ${s.ua||'—'}`],50,y+40);try{doc.addImage(s.image,'PNG',360,y+14,180,180*0.3)}catch(e){}}
    doc.setFontSize(10.5);doc.setTextColor(22,48,43);y+=146});
  doc.setFontSize(8.5);doc.setTextColor(120);doc.text(doc.splitTextToSize('Simple electronic signatures captured in the society register. Not a certified digital signature under the IT Act; use a certified e-sign service where the law requires one.',523),36,y+6);
  pdfFooter(doc);saveFile(`${slug(r.title)}-signed-${fileStamp()}.pdf`,doc.output('blob'));
}

/* =========== events =========== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.inp;if(k){UI[k]=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='gDest'){e.preventDefault();ACT.gateSend()}else if(e.target.id==='gCode'){e.preventDefault();ACT.gateVerify()}else if(e.target.id==='secCode'){e.preventDefault();ACT.secVerify()}});
document.addEventListener('change',async e=>{const t=e.target,k=t.dataset&&t.dataset.chg;if(!k)return;
  if(k==='month'){if(t.value){UI.month=t.value;render()}}
  else if(k==='horizon'){UI.horizon=+t.value;render()}
  else if(k==='attDate'){if(t.value){UI.attDate=t.value;render()}}
  else if(k==='cmpSet'){const x=by('complaints',t.dataset.id);try{await store.set('complaints',x.id,{...strip(x),status:t.value,...(t.value==='Resolved'?{resolvedOn:today()}:{})});await log('Updated complaint',`${x.title}: ${t.value}`);toast(`Marked ${t.value.toLowerCase()}`)}catch(err){toast(writeErr(err))}}
  else if(k==='hoCheck'){const h=by('handovers',t.dataset.id),l=CHECKLIST.find(c=>c[0]===t.dataset.k)[1];try{await store.set('handovers',h.id,{...strip(h),checklist:{...(h.checklist||{}),[t.dataset.k]:t.checked},log:[...(h.log||[]),{at:new Date().toISOString(),uid:ME.id,action:`${t.checked?'Ticked':'Unticked'}: ${l}`}]})}catch(err){toast(writeErr(err))}}});
document.addEventListener('submit',async e=>{if(e.target.id!=='setForm')return;e.preventDefault();
  const v=readFields(e.target,SET_FIELDS);if(!v.name){toast('Society name is required');return}
  try{const c={...strip(S.settings),...v};delete c.sample;await store.set('settings','main',c);await log('Updated society settings');toast('Settings saved')}catch(err){toast(writeErr(err))}});

/* =========== boot =========== */
render();
(async()=>{
  if(!(window.claude&&window.claude.use)){mode='local';ME.committee=true;S.settingsLoaded=true;render();return}
  const[d,u,a,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets'),claude.use('downloads')]);
  db=d;USER=u;assets=a;DL=dl;
  if(u){try{const me=await u.me();ME.id=me.id;ME.name=me.name;ME.avatar=me.avatarUrl;ME.committee=!!me.canEdit;ME.owner=!!me.isOwner}catch(e){}}
  if(!db){mode='local';ME.committee=true;S.settingsLoaded=true;render();return}
  mode='db';
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};S.settingsLoaded=true;render();scheduleNames()},()=>{S.settingsLoaded=true;render()});
  for(const c of COLS)db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>({id:x.id,...x.data()}));render();scheduleNames()},()=>{});
  db.collection('audit').orderBy('at','desc').limit(300).onSnapshot(s=>{S.audit=s.docs.map(x=>({id:x.id,...x.data()}));if(UI.tab==='audit')render();scheduleNames()},()=>{});
  if(ME.id&&!ME.committee)db.collection(`tenantdocs/${ME.id}/files`).onSnapshot(s=>{S.myFiles=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  render();
})();
