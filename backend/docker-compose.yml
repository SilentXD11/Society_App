services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: society_register
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      SR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/society_register
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    env_file: .env
    environment:
      SR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/society_register
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
